server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Full-match recordings can be several gigabytes. Nginx defaults to 1 MB,
    # which rejects real uploads before Flask ever receives them.
    client_max_body_size 20G;
    # Keep both legs of a large upload alive. Nginx first receives the browser
    # body and the backend then performs the durable S3 handoff.
    client_body_timeout 2h;
    send_timeout 2h;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Stream large match videos to Flask as the browser sends them. Without
        # this, nginx first writes the whole upload to its container filesystem;
        # multi-gigabyte recordings can disconnect before Flask sees the request.
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 7200s;
        proxy_read_timeout 7200s;
        proxy_buffering off;
    }

    # The SPA entry point references hashed JS/CSS bundles. Never let a new
    # navigation reuse an older index.html, otherwise a newly opened tab can
    # boot the previous frontend build until the user manually refreshes.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        # Purge any app-shell/bundle responses cached under older localhost
        # builds without touching login cookies or local application storage.
        add_header Clear-Site-Data '"cache"' always;
    }

    location /assets/ {
        # Localhost is used for rapid test builds. Revalidate bundles so Chrome
        # cannot keep executing a previous build after the container changes.
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
