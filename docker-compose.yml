version: "3.8"

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend/.streamlit:/app/.streamlit:ro
      - backend-data:/app/data
    depends_on:
      - redis

  worker:
    build: ./backend
    command: celery -A tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend/.streamlit:/app/.streamlit:ro
      - backend-data:/app/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

volumes:
  backend-data:
